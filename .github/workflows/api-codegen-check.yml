name: API Codegen Drift Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  codegen-check:
    name: Verify generated types are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ApexChainx/ApexChainx-Backend
          path: backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      # The backend serves its OpenAPI schema at /openapi.json without needing a
      # database or Redis, so a bare uvicorn process is enough to run codegen.
      - name: Start backend API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/apexchainx-backend.log 2>&1 &
          echo $! > /tmp/apexchainx-backend.pid

      - name: Wait for OpenAPI spec
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/openapi.json > /dev/null 2>&1; then
              echo "OpenAPI spec reachable at http://localhost:8000/openapi.json"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not serve /openapi.json within 80 seconds"
          tail -50 /tmp/apexchainx-backend.log >&2 || true
          exit 1

      - name: Run OpenAPI codegen
        env:
          OPENAPI_SPEC_URL: http://localhost:8000/openapi.json
        run: npm run codegen

      - name: Fail if generated types drifted
        run: |
          if ! git diff --exit-code -- src/types/api.generated.ts; then
            echo "::error::src/types/api.generated.ts is out of date. Run 'npm run codegen' with the backend running and commit the updated file."
            exit 1
          fi
          echo "Generated types are up to date."

      - name: Stop backend API
        if: always()
        run: |
          if [ -f /tmp/apexchainx-backend.pid ]; then
            kill "$(cat /tmp/apexchainx-backend.pid)" 2>/dev/null || true
          fi
